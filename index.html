<script>

const toggleBtn = document.getElementById('menu-toggle');
const navLinks = document.getElementById('nav-links');

toggleBtn.addEventListener('click', () => {
  navLinks.classList.toggle('show');
});
let cardsContainer = document.querySelector(".cards-container");
let input = document.querySelector(".input")
let displayProduct = async ()=>{
    let product = await fetch("https://fakestoreapi.com/products");
    let finalProduct = await product.json()
    // console.log(finalProduct);
   finalProduct.forEach(e => {
    // console.log(e);
    cardsContainer.innerHTML += ` <div class="card">
    <img src="${e.image}" alt="">
    <div class="product-title">
        <h3>${e.title}</h3>
    </div>   
    <div class="short-description">
           <p>${e.description}</p>
    </div>
    <div class="btn">
        <button><a href="#">Buy On Amazon</a></button>
    </div>
</div>`;
    
});

let input = document.querySelector("input");   
let card = cardsContainer.querySelectorAll(".card")




input.addEventListener("input",()=>{
inputValue = input.value


card.forEach(e => {
 
inputValue = inputValue.toLowerCase()
text = e.childNodes[3].childNodes[1].textContent.toLowerCase()


// console.log(text.includes(inputValue));

if (text.includes(inputValue)) {
    e.style.display = "flex";
    
    
} else {
  e.style.display = "none";
 

}



// console.log(cardsContainer.querySelector(".card"));



});

})








    
}
displayProduct()
